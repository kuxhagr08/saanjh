services:
  # Backend API & WebSocket Service
  - type: web
    name: apna-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://apna.onrender.com,https://apna-frontend.onrender.com,https://localhost,capacitor://localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: apna-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: apna-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://apna-backend.onrender.com/api"
      - key: VITE_API_BASE
        value: "https://apna-backend.onrender.com/api"
      - key: VITE_WS_BASE
        value: "wss://apna-backend.onrender.com"

databases:
  - name: apna-db
    databaseName: apna
    user: apna_admin
    plan: free
